services:
  mysql:
    image: mysql:8.0
    container_name: elearning-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootroot
      MYSQL_DATABASE: Elearning
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootroot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
